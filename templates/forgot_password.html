<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - IDOMA HUB</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="auth-page">
<div class="auth-card">
<h1>Forgot Password?</h1>
<p class="auth-intro">Enter the email address you used to register. We'll send you a password-reset link if an account matches.</p>

{{if .Registered}}
<div class="auth-error" role="status">
If an account exists with that email, password-reset instructions have been sent.
</div>
{{end}}

{{if .Error}}<div class="auth-error" role="alert">{{.Error}}</div>{{end}}

<form action="/forgot-password" method="POST">
<label for="email">Registered Email</label>
<input type="email" id="email" name="email" placeholder="Enter your email" required>
<button type="submit" class="auth-button">Send Reset Link</button>
</form>

<p class="auth-footer"><a href="/login">Back to Login</a></p>
</div>
</main>
</body>
</html>
