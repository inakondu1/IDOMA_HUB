<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDOMA HUB</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <meta name="theme-color" content="#850c13">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="IDOMA HUB">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/idoma-app-192.png">
    <link rel="apple-touch-icon" href="/static/images/idoma-app-192.png">
</head>

<body class="simple-home">

    <main class="simple-home-content">

        <div class="simple-home-logo">
            IDOMA HUB
        </div>

        <p class="simple-home-tagline">
            Our People. Our Culture. Our Land.
        </p>

        <a href="/register" class="button primary simple-home-button">
            Join the Community
        </a>

        <p class="simple-home-login">
            Already a member?
            <a href="/login">Log in</a>
        </p>

    </main>

    <footer>
        <p>© 2026 IDOMA HUB</p>
    </footer>


<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js")
            .catch(function (error) {
                console.error("IDOMA HUB service worker registration failed:", error);
            });
    });
}
</script>

</body>
</html>
