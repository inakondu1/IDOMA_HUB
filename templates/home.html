<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDOMA HUB</title>
    <link rel="stylesheet" href="/static/css/style.css">

    <link rel="manifest" href="/static/manifest.webmanifest">
    <meta name="theme-color" content="#b5121b">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

</head>

<body class="simple-home">

    <main class="simple-home-content">

        <div class="simple-home-logo">
            IDOMA HUB
        </div>

        <p class="simple-home-tagline">
            Our People. Our Culture. Our Land.
        </p>

        <a href="/register" class="button primary simple-home-button">
            Join the Community
        </a>

        <p class="simple-home-login">
            Already a member?
            <a href="/login">Log in</a>
        </p>

    </main>

    <footer>
        <p>© 2026 IDOMA HUB</p>
    </footer>


    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("/sw.js")
                .catch(error => console.error("Service worker registration failed:", error));
        });
    }
    </script>

</body>
</html>
