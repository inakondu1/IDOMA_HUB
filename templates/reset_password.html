<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - IDOMA HUB</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="auth-page">
<div class="auth-card">
<h1>Create a New Password</h1>
<p class="auth-intro">Choose a new password for your IDOMA HUB account.</p>

{{if .Error}}<div class="auth-error" role="alert">{{.Error}}</div>{{end}}

<form action="/reset-password" method="POST">
<input type="hidden" name="token" value="{{.Token}}">

<label for="password">New Password</label>
<input type="password" id="password" name="password" minlength="8" required>

<label for="confirm_password">Confirm New Password</label>
<input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

<button type="submit" class="auth-button">Update Password</button>
</form>

<p class="auth-footer"><a href="/login">Back to Login</a></p>
</div>
</main>
</body>
</html>
